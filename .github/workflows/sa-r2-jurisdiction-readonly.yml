name: SA R2 bucket jurisdiction READ-ONLY audit
on:
  push:
    branches: [diagnostics/sa-r2-readonly-jurisdiction-audit]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare existing R2 bucket jurisdiction metadata (GET only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account)throw Error('Cloudflare credentials missing');
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+account+'/r2/buckets/svari-aplinka-foto';
          for (const jurisdiction of ['default','eu']) {
            const res=await fetch(endpoint,{
              method:'GET',
              headers:{Authorization:'Bearer '+token,'cf-r2-jurisdiction':jurisdiction},
              signal:AbortSignal.timeout(20000)
            });
            const json=await res.json().catch(()=>({}));
            const b=json.result||{};
            console.log(JSON.stringify({
              jurisdictionRequested:jurisdiction,
              httpStatus:res.status,
              apiSuccess:json.success===true,
              bucketFound:!!b.name,
              bucketName:b.name||null,
              bucketJurisdiction:b.jurisdiction||null,
              location:b.location||null,
              createdAt:b.creation_date||null,
              errorCodes:(json.errors||[]).map(e=>e.code)
            }));
          }
          console.log('READ ONLY: no R2 object read/writes or account changes.');
          NODE
