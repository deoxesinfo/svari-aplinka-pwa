name: Build and deploy PWA demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build (authenticated admin R2 photos enabled)
        env:
          VITE_SA_R2_PHOTOS: enabled
          VITE_SA_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Write version marker for safe browser updates
        run: printf '{"sha":"%s"}\n' "$GITHUB_SHA" > dist/version.json
      - name: Test interactive work-card opening
        run: npm test
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # The one-time 2026-11-05 Pages cancellation was completed.
      # Let the official deploy-pages action manage active deployment state.
      - id: deployment
        uses: actions/deploy-pages@v4
