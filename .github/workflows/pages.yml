name: Build and deploy PWA demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build (authenticated admin R2 photos enabled)
        env:
          VITE_SA_R2_PHOTOS: enabled
          VITE_SA_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Test interactive work-card opening
        run: npm test
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Guarded recovery of the specific ghost deployment from 2026-11-05.
      # 204 means cancellation accepted, not necessarily that Pages has cleared the lock.
      - name: Ensure earlier Pages deployment finished
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments/9a03890ada5e1ed4df7cedc1bc23b8067ab4d5ed"
          for attempt in 1 2 3 4 5 6; do
            response="$(curl -fsS -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              -H "Authorization: Bearer $GH_TOKEN" "$url")"
            state="$(printf '%s' "$response" | jq -r '.status // empty')"
            echo "Prior Pages state (check $attempt): $state"
            case "$state" in
              canceled|cancelled|deployment_cancelled|deployment_canceled|failed|failure|deployment_failed|errored|error|succeed|success|inactive)
                echo "Prior deployment is no longer active."; exit 0;;
              in_progress|queued|pending|updating_pages|requested)
                code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2026-03-10' \
                  -H "Authorization: Bearer $GH_TOKEN" "$url/cancel")"
                echo "Cancellation requested (HTTP $code)"
                if [ "$code" != "204" ] && [ "$code" != "404" ]; then exit 1; fi;;
              *) echo "::error::Unexpected previous deployment state; stopping"; exit 1;;
            esac
            sleep 20
          done
          echo "::error::The old Pages deployment remains active despite cancellation requests."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
