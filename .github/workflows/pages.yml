name: Build and deploy PWA demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build (authenticated admin R2 photos enabled)
        env:
          VITE_SA_R2_PHOTOS: enabled
        run: npm run build
      - name: Test interactive work-card opening
        run: npm test
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # One-time recovery: the previous Pages deployment timed out but remained marked in-progress.
      # Cancel only this exact stale build. Do not cancel active or unrelated deployments.
      - name: Clear stale Pages deployment 9a03890 (one-time)
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/sa-pages-cancel.txt -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments/9a03890ada5e1ed4df7cedc1bc23b8067ab4d5ed/cancel")
          echo "Stale Pages cancellation HTTP status: $status"
          if [ "$status" != "204" ] && [ "$status" != "404" ]; then
            echo "::error::Could not clear stuck Pages deployment"
            cat /tmp/sa-pages-cancel.txt
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
