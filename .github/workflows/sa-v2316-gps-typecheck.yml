name: ŠA V2.3.16 strict TypeScript + GPS UI verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/app/AddressLocationPicker.tsx'
      - 'src/test/address-location-picker.test.tsx'
      - '.github/workflows/sa-v2316-gps-typecheck.yml'
permissions:
  contents: read
jobs:
  strict-gps:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript diagnostics – fail on GPS changes, report pre-existing project errors
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/sa-tsc.log 2>&1
          result=$?
          set -e
          grep 'error TS' /tmp/sa-tsc.log | head -n 8 || true
          if grep -Eq '^src/(components/app/AddressLocationPicker[.]tsx|lib/geocode-address[.]ts|test/address-location-picker[.]test[.]tsx|test/geocode-address[.]test[.]ts)\([0-9]+,[0-9]+\): error TS' /tmp/sa-tsc.log; then
            echo "::error::GPS V2.3.16 feature has TypeScript errors:"
            grep -E '^src/(components/app/AddressLocationPicker[.]tsx|lib/geocode-address[.]ts|test/address-location-picker[.]test[.]tsx|test/geocode-address[.]test[.]ts)\([0-9]+,[0-9]+\): error TS' /tmp/sa-tsc.log
            exit 1
          fi
          if [ "$result" -ne 0 ]; then
            count=$(grep -c 'error TS' /tmp/sa-tsc.log || true)
            echo "::warning::Existing project-wide TypeScript backlog: $count unrelated diagnostics. V2.3.16 GPS files passed."
            echo "TypeScript project-wide backlog: $count errors (unrelated to V2.3.16 GPS scope)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "TypeScript entire project passed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: GPS interactive regression tests
        run: npm test -- src/test/address-location-picker.test.tsx
