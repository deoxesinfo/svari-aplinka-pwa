name: ŠA V2.3.14 Worker controlled release
on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/photo-worker.mjs'
      - 'cloudflare/photo-worker.test.mjs'
      - 'cloudflare/storage-admin.test.mjs'
      - 'wrangler.toml'
      - '.github/workflows/sa-v2314-worker-release.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/photo-worker.mjs'
      - 'cloudflare/photo-worker.test.mjs'
      - 'cloudflare/storage-admin.test.mjs'
      - 'wrangler.toml'
      - '.github/workflows/sa-v2314-worker-release.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test GPS, photo upload and storage guards without mutations
        run: |
          node --check cloudflare/photo-worker.mjs
          node --test cloudflare/photo-worker.test.mjs cloudflare/storage-admin.test.mjs
      - name: Check Wrangler configuration without deployment
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --outdir /tmp/sa-v2314-worker --no-x-provision

  release:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'SA_V2314_WORKER_RELEASE_APPROVED')
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare API token secret and account ID secret or variable
        id: creds
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' || vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          if [ "$HAS_CF_TOKEN" = 'true' ] && [ "$HAS_CF_ACCOUNT" = 'true' ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment credentials configured.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Cloudflare credentials not configured in GitHub Secrets. Worker NOT deployed.'
            echo 'Worker NOT deployed: check CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Require existing EU R2 bucket before any Worker deployment
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/r2/buckets/svari-aplinka-foto';
          const response=await fetch(endpoint,{
            method:'GET',
            headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'cf-r2-jurisdiction':'eu'},
            signal:AbortSignal.timeout(20000)
          });
          const body=await response.json();
          assert.equal(response.status,200,'Existing EU R2 bucket GET failed');
          assert.equal(body.success,true,'Existing EU R2 bucket absent');
          assert.equal(body.result?.jurisdiction,'eu','Not the EU jurisdiction');
          assert.equal(body.result?.name,'svari-aplinka-foto');
          console.log('PASS existing EU R2 bucket present; no new bucket may be provisioned.');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy same private Worker using tested Wrangler CLI; preserve vars; deletion OFF
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
        run: npx --yes wrangler@4 deploy --config wrangler.toml --keep-vars --no-x-provision
      - name: Probe actual live version (no auth, no photo operations)
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://svari-aplinka-photos.svariaplinka-lt.workers.dev/health';
          let result;
          for (let i=0;i<6;i++) {
            const response=await fetch(url,{signal:AbortSignal.timeout(12000),cache:'no-store'});
            result=await response.json();
            if (response.status===200&&result.apiVersion==='2.3.14'&&result.storageStatsEnabled===true) break;
            await new Promise(resolve=>setTimeout(resolve,2000));
          }
          assert.equal(result?.apiVersion,'2.3.14','Live Worker still old version');
          assert.equal(result.storageStatsEnabled,true);
          const org='00000000-0000-4000-8000-000000000002';
          for(const path of ['/v1/storage/usage','/v1/photos/00000000-0000-4000-8000-000000000001/thumb']){
            const r=await fetch('https://svari-aplinka-photos.svariaplinka-lt.workers.dev'+path,{
              headers:{'x-organization-id':org},signal:AbortSignal.timeout(12000)
            });
            assert.equal(r.status,401,'Private route must require JWT: '+path);
          }
          console.log('PASS Worker V2.3.14 live; R2 route exists, anonymous photo/storage access denied. No data changed.');
          NODE
