name: SA Cloudflare credential presence diagnostic (NO DEPLOY)
on:
  push:
    branches:
      - diagnostics/sa-cloudflare-config-readonly
permissions:
  contents: read
jobs:
  check-names-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect presence of GitHub secrets/variables without reading values
        env:
          SECRET_API: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          VARIABLE_API: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
          SECRET_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          VARIABLE_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
          ALT_SECRET_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID != '' }}
          ALT_VARIABLE_ACCOUNT: ${{ vars.CF_ACCOUNT_ID != '' }}
          ALT_SECRET_TOKEN: ${{ secrets.CF_API_TOKEN != '' }}
        run: |
          echo "PROBE: secret CLOUDFLARE_API_TOKEN: $SECRET_API"
          echo "PROBE: variable CLOUDFLARE_API_TOKEN: $VARIABLE_API"
          echo "PROBE: secret CLOUDFLARE_ACCOUNT_ID: $SECRET_ACCOUNT"
          echo "PROBE: variable CLOUDFLARE_ACCOUNT_ID: $VARIABLE_ACCOUNT"
          echo "PROBE: secret CF_ACCOUNT_ID: $ALT_SECRET_ACCOUNT"
          echo "PROBE: variable CF_ACCOUNT_ID: $ALT_VARIABLE_ACCOUNT"
          echo "PROBE: secret CF_API_TOKEN: $ALT_SECRET_TOKEN"
          echo "NO DEPLOY, NO DATA CHANGES, NO TOKEN VALUES PRINTED. UPDATED CHECK AFTER USER CONFIGURED SECRET AND VARIABLE."
